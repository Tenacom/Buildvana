name: Build, run tests, and pack

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main, develop, hotfix/*, dev/*, 'v[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ main, develop, hotfix/*, dev/*, 'v[0-9]+.[0-9]+' ]

# A push to a pull request branch supersedes the run of the previous push. A push to a branch does not: every commit gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_test_pack:
    name: bv ${{ matrix.command }} on ${{ matrix.os }}
    strategy:
      # The tests read paths, processes, and consoles, which differ per platform, so the result of each runner stays useful.
      fail-fast: false
      matrix:
        include:
        # The release packs on Linux, so the Linux run is the one that checks the packages.
        - os: ubuntu-latest
          command: pack
        # The Windows run exists for the tests on the other supported platform, and packs nothing.
        - os: windows-latest
          command: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # A hung test must not hold a runner for the default six hours.
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_UI_LANGUAGE: 'en-US'
      FEEDZ_IO_PRIVATE_TOKEN: ${{ secrets.FEEDZ_IO_PRIVATE_TOKEN }}
      # bv reads its GitHub token from the environment variable named by hosts.github.tokenEnv in buildvana.jsonc.
      # The automatic token is enough here: no release operation is performed.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Set bogus local NuGet package directory
      shell: bash
      run: echo "NUGET_LOCAL_PACKAGES=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Checkout repository with full history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Checkout with full history so Buildvana can compute the Git height of the version line correctly.
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          dotnet-tools.json
          Directory.Packages.props
    - name: Restore .NET tools
      shell: bash
      run: dotnet tool restore
    - name: Verify buildvana.jsonc schema is up to date
      shell: bash
      run: dotnet run tools/generate-config-schema.cs -- --check
    - name: Run bv ${{ matrix.command }}
      shell: bash
      run: |
        if [ "$RUNNER_DEBUG" = "1" ]; then
          dotnet bv ${{ matrix.command }} --verbosity diagnostic
        else
          dotnet bv ${{ matrix.command }}
        fi
    - name: Upload coverage to Codecov
      if: ${{ hashFiles('TestResults/*.cobertura.xml') != '' }}
      uses: codecov/codecov-action@v7
      with:
        files: TestResults/*.cobertura.xml
        token: ${{ secrets.CODECOV_GLOBAL_UPLOAD_TOKEN }}
        verbose: true
