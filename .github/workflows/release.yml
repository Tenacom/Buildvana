name: Publish a release

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version spec change'
        required: true
        type: choice
        default: 'none'
        options:
        - none
        - unstable
        - stable
        - minor
        - major
      checkPublicApi:
        description: 'Check public API files'
        required: false
        default: true
        type: boolean
      dogfood:
        description: 'Update self-references to the released version'
        required: false
        default: true
        type: boolean
      buildvanaVerbosity:
        description: 'Buildvana verbosity'
        required: true
        type: choice
        default: 'normal'
        options:
        - normal
        - detailed
        - diagnostic
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_UI_LANGUAGE: 'en-US'
      # Secrets consumed by bv. Which environment variable carries each one is named in buildvana.jsonc:
      # - github.tokenEnv (implicitly GITHUB_TOKEN) holds the token used for release operations and Git pushes;
      #   here it is the release PAT, which - unlike the automatic token - can push to a protected branch.
      # - nuget.feeds.prerelease.apiKeyEnv is FEEDZ_IO_PRIVATE_TOKEN (public Feedz.io preview feed);
      # - nuget.feeds.release.apiKeyEnv is NUGET_DEPLOYMENT_KEY (nuget.org).
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      FEEDZ_IO_PRIVATE_TOKEN: ${{ secrets.FEEDZ_IO_PRIVATE_TOKEN }}
      NUGET_DEPLOYMENT_KEY: ${{ secrets.NUGET_DEPLOYMENT_KEY }}

      BV_BUMP: ${{ inputs.bump }}
      BV_CHECK_PUBLIC_API: ${{ inputs.checkPublicApi }}
      BV_DOGFOOD: ${{ inputs.dogfood }}
      BV_VERBOSITY: ${{ inputs.buildvanaVerbosity }}
    steps:
    - name: Set bogus local NuGet package directory
      shell: bash
      run: echo "NUGET_LOCAL_PACKAGES=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Log workflow inputs
      shell: bash
      run: |
        echo "Version spec change     : $BV_BUMP"
        echo "Check public API files  : $BV_CHECK_PUBLIC_API"
        echo "Update self-references  : $BV_DOGFOOD"
        echo "Buildvana verbosity     : $BV_VERBOSITY"
    - name: Checkout repository with full history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Checkout with full history so Buildvana can compute the Git height of the version line correctly.
        token: ${{ secrets.RELEASE_TOKEN }}
        persist-credentials: true # Buildvana pushes release commits and tags over the checkout's credentials.
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          .config/dotnet-tools.json
          Directory.Packages.props
    - name: Restore .NET tools
      shell: bash
      run: dotnet tool restore
    - name: Run Buildvana release
      id: build
      shell: bash
      run: |
        if [ -z "$BV_VERBOSITY" ]; then BV_VERBOSITY=normal; fi
        if [ "$RUNNER_DEBUG" = "1" ]; then BV_VERBOSITY=diagnostic; fi
        dotnet bv release --verbosity "$BV_VERBOSITY" --bump "$BV_BUMP" --check-public-api "$BV_CHECK_PUBLIC_API" --dogfood "$BV_DOGFOOD"
    - name: Upload coverage to Codecov
      if: ${{ hashFiles('TestResults/*.cobertura.xml') != '' }}
      uses: codecov/codecov-action@v7
      with:
        working-directory: TestResults
        files: '*.cobertura.xml'
        name: v${{ steps.build.outputs.version }}
        verbose: true
